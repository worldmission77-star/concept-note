{% extends "base.html" %}
{% block title %}{% if note %}노트 수정{% else %}새 노트{% endif %} - 개념노트{% endblock %}
{% block content %}
<div class="card form-card">
    <h1>{% if note %}노트 수정{% else %}새 노트 작성{% endif %}</h1>
    <form method="post" enctype="multipart/form-data">
        <label>제목
            <input type="text" name="title" value="{{ form.get('title', '') }}" required autofocus>
        </label>
        <label>날짜
            <input type="date" name="note_date" value="{{ form.get('note_date', today) }}" required>
        </label>
        <label>내용
            <textarea name="content" rows="10" placeholder="배운 개념을 정리해보세요...">{{ form.get('content', '') }}</textarea>
        </label>
        <label>사진 첨부 (1장)
            <input type="file" name="photo" accept="image/*">
        </label>
        {% if note and note['photo_filename'] %}
        <div class="current-photo">
            <img src="{{ url_for('uploaded_file', filename=note['photo_filename']) }}" alt="첨부된 사진">
            <label class="checkbox-label">
                <input type="checkbox" name="remove_photo" value="1"> 사진 삭제
            </label>
        </div>
        {% endif %}
        <div class="form-actions">
            <button type="submit">저장</button>
            {% if note %}
            <a class="btn-secondary" href="{{ url_for('note_detail', note_id=note['id']) }}">취소</a>
            {% else %}
            <a class="btn-secondary" href="{{ url_for('notes_list') }}">취소</a>
            {% endif %}
        </div>
    </form>
</div>
{% endblock %}
