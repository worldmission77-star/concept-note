{% extends "base.html" %}
{% block title %}학생 계정 추가 - 관리자{% endblock %}
{% block content %}
<div class="card form-card">
    <h1>학생 계정 추가</h1>
    <form method="post">
        <label>아이디
            <input type="text" name="username" value="{{ form.get('username', '') }}" required autofocus>
        </label>
        <label>비밀번호
            <input type="password" name="password" required>
        </label>
        <label>비밀번호 확인
            <input type="password" name="password_confirm" required>
        </label>
        <label>이름
            <input type="text" name="name" value="{{ form.get('name', '') }}" required>
        </label>
        <label>학년
            <select name="grade" required>
                <option value="" disabled {% if not form.get('grade') %}selected{% endif %}>선택하세요</option>
                {% for g in ['초1','초2','초3','초4','초5','초6','중1','중2','중3','고1','고2','고3'] %}
                <option value="{{ g }}" {% if form.get('grade') == g %}selected{% endif %}>{{ g }}</option>
                {% endfor %}
            </select>
        </label>
        <label>학생 연락처
            <input type="tel" name="student_phone" value="{{ form.get('student_phone', '') }}" placeholder="010-0000-0000">
        </label>
        <label>부모님 연락처
            <input type="tel" name="parent_phone" value="{{ form.get('parent_phone', '') }}" placeholder="010-0000-0000">
        </label>
        <div class="form-actions">
            <button type="submit">계정 생성</button>
            <a class="btn-secondary" href="{{ url_for('admin_students') }}">취소</a>
        </div>
    </form>
</div>
{% endblock %}
